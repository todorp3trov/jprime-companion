name: jprime-companion-containers

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: jprime
      POSTGRES_USER: jprime
      POSTGRES_PASSWORD: jprime
    volumes:
      - jprime_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jprime -d jprime"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jprime
      DB_USERNAME: jprime
      DB_PASSWORD: jprime
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      JAVA_TOOL_OPTIONS: -Dnet.bytebuddy.experimental=true
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  jprime_pgdata:
