# Local dev: the Gradle daemon runs on the system JDK (21) but compiles/runs the
# project with the Java 25 toolchain. Point Gradle at the Homebrew JDK 25 so it
# does not need to download a toolchain. Adjust if your JDK 25 lives elsewhere.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home
org.gradle.java.installations.auto-download=false
